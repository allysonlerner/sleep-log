<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sleep Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Sleep Log</title>
<style>
  :root {
    --bg: #0f1115; --fg: #e8eaed; --muted: #8b919a; --card: #1a1d23;
    --crib: #FFF2CC; --sleeping: #B6D7A8; --awake: #2a2f37; --nursing: #D9D2E9; --crying: #F4CCCC;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; height: 100dvh; user-select: none; -webkit-user-select: none;
    padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom); gap: 10px; }
  #now { margin-top: 10px; background: var(--card); border-left: 8px solid var(--muted); border-radius: 12px;
    padding: 12px 14px; min-height: 66px; }
  #nowMain { font-size: 22px; font-weight: 700; }
  #nowSub { font-size: 14px; color: var(--muted); margin-top: 2px; }
  #chips { display: flex; gap: 8px; align-items: center; overflow-x: auto; padding-bottom: 2px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  #chips::-webkit-scrollbar { display: none; }
  #chips .label { color: var(--muted); font-size: 13px; flex: none; }
  .chip { flex: none; border: 1px solid #3a3f48; background: transparent; color: var(--fg); border-radius: 999px;
    padding: 8px 14px; font-size: 15px; }
  .chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  #buttons { flex: 1; display: grid; grid-template-rows: repeat(5, 1fr); gap: 10px; min-height: 0; }
  .ev { border: 0; border-radius: 16px; font-size: 28px; font-weight: 800; color: #222; filter: brightness(.88);
    transition: transform .06s, filter .15s; }
  .ev[data-ev="awake"] { color: #c9ced6; border: 1px solid #3a3f48; filter: none; }
  .ev:active { transform: scale(.98); filter: brightness(1); }
  .ev.flash { filter: brightness(1.15); }
  #foot { display: flex; align-items: center; gap: 10px; padding-bottom: 8px; }
  #undo { flex: 1; border: 1px solid #3a3f48; background: transparent; color: var(--fg); border-radius: 12px;
    padding: 14px; font-size: 17px; }
  #undo:disabled { opacity: .35; }
  #gear { border: 1px solid #3a3f48; background: transparent; color: var(--fg); border-radius: 12px;
    padding: 14px 16px; font-size: 17px; }
  #sync { font-size: 12px; color: var(--muted); min-width: 90px; text-align: right; }
  #sync.bad { color: #f28b82; }
  dialog { background: var(--card); color: var(--fg); border: 1px solid #3a3f48; border-radius: 16px; padding: 20px;
    width: min(92vw, 420px); position: fixed; inset: auto; margin: 0; top: 50%; left: 50%;
    transform: translate(-50%, -50%); max-height: calc(100dvh - 24px); overflow-y: auto; }
  html.kb dialog { top: var(--dlg-top, 12px); transform: translateX(-50%); max-height: var(--dlg-max, calc(100dvh - 24px)); }
  dialog::backdrop { background: rgba(0,0,0,.7); }
  dialog h2 { margin: 0 0 12px; font-size: 20px; }
  dialog label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  dialog input { width: 100%; padding: 12px; font-size: 17px; border-radius: 10px; border: 1px solid #3a3f48;
    background: var(--bg); color: var(--fg); user-select: text; -webkit-user-select: text; }
  dialog .row { display: flex; gap: 8px; margin-top: 16px; }
  dialog button { flex: 1; padding: 12px; font-size: 16px; border-radius: 10px; border: 1px solid #3a3f48;
    background: transparent; color: var(--fg); }
  dialog button.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .hint { font-size: 13px; color: var(--muted); margin-top: 10px; line-height: 1.4; }
  .err { font-size: 13px; color: #f28b82; margin-top: 6px; min-height: 1em; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #E24B4A;
    animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
  #naps { display: flex; align-items: center; justify-content: space-between; width: 100%; text-align: left;
    background: var(--card); border: 1px solid #B6D7A8; border-radius: 12px; padding: 8px 14px; color: var(--fg); font: inherit; }
  #naps .lab { font-size: 12px; color: var(--muted); }
  #napsVal { font-size: 17px; font-weight: 600; color: #B6D7A8; display: flex; align-items: center; gap: 8px; }
  #napsVal small { font-size: 12px; font-weight: 400; color: var(--muted); }
  #naps .chev { font-size: 22px; color: var(--muted); }
  .timerow { display: flex; gap: 8px; align-items: stretch; }
  .timerow input { font-size: 32px; font-weight: 600; letter-spacing: 1px; }
  #ampm { display: flex; flex-direction: column; gap: 6px; width: 72px; }
  #ampm button { flex: 1; padding: 0; font-size: 16px; }
  #ampm button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  #today { position: fixed; inset: 0; z-index: 10; background: var(--bg); display: flex; flex-direction: column; gap: 8px;
    padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom); }
  #today[hidden] { display: none; }
  #todayBar { margin-top: 10px; display: flex; align-items: center; justify-content: space-between; }
  #todayBack { border: 0; background: transparent; color: var(--muted); font-size: 16px; padding: 8px 4px; }
  #todayHead { background: var(--card); border-radius: 12px; padding: 10px 14px; }
  #todayNaps { font-size: 14px; color: #B6D7A8; margin-top: 2px; display: flex; align-items: center; gap: 8px; }
  #timeline { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; padding-bottom: 12px;
    -webkit-overflow-scrolling: touch; }
  #timeline .empty { color: var(--muted); text-align: center; margin-top: 40px; }
  .blk { flex: none; border-radius: 6px; color: #222; display: flex; justify-content: space-between; align-items: center;
    padding: 0 10px; font-size: 13px; }
  .blk.tall { align-items: flex-start; padding: 7px 10px; font-size: 13px; }
  .blk .t1 { display: block; }
  .blk .name { font-weight: 600; font-size: 15px; }
  .blk .dur { font-weight: 600; white-space: nowrap; }
  .blk.now { margin-top: 6px; outline: 2px solid var(--fg); outline-offset: 2px; border-radius: 8px 8px 0 0;
    border-bottom: 3px dashed var(--bg); align-items: flex-start; padding: 8px 10px; }
  .blk .right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .pill { background: var(--bg); color: var(--fg); border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 6px; }
  #todayBar { justify-content: space-between; }
  #toToday { border: 0; background: transparent; color: #B6D7A8; font-size: 15px; padding: 8px 4px; }
  #vnav { display: flex; align-items: center; justify-content: space-between; }
  #vnav button { border: 0; background: transparent; color: var(--fg); font-size: 28px; line-height: 1; padding: 2px 14px; }
  #vnav button:disabled { color: #3a3f48; }
  #vTitle { font-size: 18px; font-weight: 600; }
  #vseg { display: flex; background: var(--card); border-radius: 10px; padding: 3px; }
  #vseg button { flex: 1; border: 0; background: transparent; color: var(--muted); border-radius: 8px; padding: 7px 0; font-size: 15px; }
  #vseg button.on { background: var(--fg); color: var(--bg); font-weight: 600; }
  #todayWake { font-size: 13px; color: var(--muted); margin-top: 2px; }
  #weekView { flex: 1; overflow-y: auto; padding-bottom: 12px; }
  .wgrid { display: grid; grid-template-columns: 40px repeat(7, 1fr); align-items: center; font-size: 11px; }
  .wgrid .lab { color: var(--muted); line-height: 1.15; }
  .wgrid .c { text-align: center; padding: 3px 0; }
  .wgrid .hd { font-weight: 600; border-radius: 6px; }
  .wgrid .hd.today { background: var(--fg); color: var(--bg); }
  .wgrid .nap { color: #B6D7A8; font-weight: 600; }
  .wgrid .tap { cursor: pointer; }
  .wcols { display: grid; grid-template-columns: 40px repeat(7, 1fr); gap: 2px; margin-top: 6px; }
  .waxis { position: relative; }
  .waxis span { position: absolute; right: 4px; font-size: 11px; color: var(--muted); transform: translateY(-50%); }
  .wcol { position: relative; background: #14171c; border-radius: 4px; overflow: hidden; cursor: pointer; }
  .wcol.future { cursor: default; }
  .wcol .b { position: absolute; left: 0; right: 0; }
  .wcol .hl { position: absolute; left: 0; right: 0; border-top: 0.5px solid #2b3038; }
  .wcol .nowline { position: absolute; left: 0; right: 0; border-top: 2px solid var(--fg); }
</style>
</head>
<body>
  <section id="now">
    <div id="nowMain">Loading…</div>
    <div id="nowSub"></div>
  </section>

  <button id="naps" type="button">
    <span><span class="lab">Naps today</span><br><span id="napsVal">—</span></span>
    <span class="chev" aria-hidden="true">›</span>
  </button>

  <div id="chips">
    <span class="label">Time:</span>
    <button class="chip on" data-min="0">Now</button>
    <button class="chip" data-min="5">5 min ago</button>
    <button class="chip" data-min="10">10 min ago</button>
    <button class="chip" data-min="15">15 min ago</button>
    <button class="chip" data-min="30">30 min ago</button>
    <button class="chip" data-min="other">Other…</button>
  </div>

  <main id="buttons">
    <button class="ev" data-ev="crib"     style="background:var(--crib)">Down in crib</button>
    <button class="ev" data-ev="sleeping" style="background:var(--sleeping)">Sleeping</button>
    <button class="ev" data-ev="awake"    style="background:var(--awake)">Awake</button>
    <button class="ev" data-ev="nursing"  style="background:var(--nursing)">Nursing</button>
    <button class="ev" data-ev="crying"   style="background:var(--crying)">Crying</button>
  </main>

  <footer id="foot">
    <button id="undo" disabled>Undo last</button>
    <span id="sync"></span>
    <button id="gear" aria-label="Settings">⚙︎</button>
  </footer>

  <dialog id="setup">
    <h2 id="setupTitle">Set up this phone</h2>
    <label for="nameIn">Your name (shown next to what you log)</label>
    <input id="nameIn" autocomplete="off" enterkeyhint="done" placeholder="e.g. Sam">
    <div id="codeWrap">
      <label for="codeIn">Setup code</label>
      <input id="codeIn" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="paste the code here">
    </div>
    <div class="hint" id="setupHint"></div>
    <div class="row">
      <button id="copyLink" type="button" hidden>Copy link for partner</button>
      <button id="setupSave" class="primary" type="button">Save</button>
    </div>
  </dialog>

  <dialog id="otherDlg">
    <h2>What time?</h2>
    <div class="timerow">
      <input id="timeIn" inputmode="numeric" pattern="[0-9]*" autocomplete="off" enterkeyhint="done" maxlength="5" placeholder="4:30" aria-label="Time">
      <div id="ampm">
        <button type="button" data-ap="AM">AM</button>
        <button type="button" data-ap="PM">PM</button>
      </div>
    </div>
    <div class="hint" id="timeHint">Type the digits, like 430. No colon needed.</div>
    <div class="err" id="timeErr"></div>
    <div class="row">
      <button id="timeCancel" type="button">Cancel</button>
      <button id="timeUse" class="primary" type="button">Use time</button>
    </div>
  </dialog>

  <section id="today" hidden>
    <div id="todayBar">
      <button id="todayBack" type="button">‹ Back</button>
      <button id="toToday" type="button" hidden>Back to today</button>
    </div>
    <div id="vnav">
      <button id="vPrev" type="button" aria-label="Previous">‹</button>
      <div id="vTitle">Today</div>
      <button id="vNext" type="button" aria-label="Next">›</button>
    </div>
    <div id="vseg">
      <button type="button" data-mode="day" class="on">Day</button>
      <button type="button" data-mode="week">Week</button>
    </div>
    <div id="todayHead">
      <div id="todayNaps"></div>
      <div id="todayWake"></div>
    </div>
    <div id="timeline"></div>
    <div id="weekView" hidden>
      <div id="weekSum"></div>
      <div id="weekCols"></div>
      <div class="hint" id="weekHint">Tap a day to open it</div>
    </div>
  </section>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
